            fill="#40513d"
        />

        <rect
            x="9"
            y="27"
            width="6"
            height="8"
            fill="#594936"
        />

    </g>


    <!-- 城市 -->
    <g id="citySymbol">

        <circle
            cx="0"
            cy="0"
            r="9"
            fill="#d5b66d"
            stroke="#3b3022"
            stroke-width="3"
        />

        <path
            d="M-5 -2 L-5 5 L5 5 L5 -2 L2 -2 L2 -7 L-2 -7 L-2 -2 Z"
            fill="#3b3022"
        />

    </g>

</defs>


