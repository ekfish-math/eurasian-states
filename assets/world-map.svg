<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 2000 900"
     width="2000"
     height="900">

<defs>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#263f43"/>
    <stop offset="1" stop-color="#1d3337"/>
  </linearGradient>

  <style>
    .province {
      stroke:#3d3428;
      stroke-width:4;
      stroke-linejoin:round;
      cursor:pointer;
    }

    .province:hover {
      filter:brightness(1.18);
    }

    .province-label {
      font-family:serif;
      font-size:24px;
      font-weight:bold;
      fill:#30291f;
      text-anchor:middle;
      pointer-events:none;
    }
  </style>
</defs>

<!-- 海洋 -->
<rect width="2000" height="900" fill="url(#sea)"/>

