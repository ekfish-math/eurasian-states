<!-- =====================================================
     歐亞之國
     World Map v0.1.2
     虛構中世紀世界
===================================================== -->

<defs>

    <!-- 羊皮紙紋理 -->
    <filter id="paper">
        <feTurbulence
            type="fractalNoise"
            baseFrequency="0.025"
            numOctaves="3"
            seed="7"
        />

        <feColorMatrix
            type="matrix"
            values="
            0.35 0 0 0 0.35
            0 0.28 0 0 0.22
            0 0 0.12 0 0.08
            0 0 0 0.20 0
            "
        />
    </filter>


    <!-- 山脈 -->
    <g id="mountainSymbol">

        <path
            d="M0 35 L18 5 L34 35 Z"
            fill="#514634"
            stroke="#322b21"
            stroke-width="2"
        />

        <path
            d="M20 35 L39 11 L57 35 Z"
            fill="#625440"
            stroke="#322b21"
            stroke-width="2"
        />

    </g>


    <!-- 森林 -->
    <g id="tree">

