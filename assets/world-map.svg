                 L22 30 L17 20 L24 20Z"
              fill="#40513d"/>
        <rect x="9" y="28" width="6" height="8"
              fill="#584735"/>
    </g>

    <g id="city">
        <circle r="9"
                fill="#d4b66f"
                stroke="#3a3024"
                stroke-width="3"/>
        <path d="M-5 -2V5H5V-2H2V-7H-2V-2Z"
              fill="#3a3024"/>
    </g>

</defs>


