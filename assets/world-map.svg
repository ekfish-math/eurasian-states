<defs>

    <filter id="paper">
        <feTurbulence
            type="fractalNoise"
            baseFrequency=".018"
            numOctaves="3"
            seed="9"/>
        <feColorMatrix
            values="
            .32 0 0 0 .34
            0 .27 0 0 .24
            0 0 .12 0 .08
            0 0 0 .16 0"/>
    </filter>

    <g id="mountain">
        <path d="M0 34 L18 5 L36 34Z"
              fill="#514735"
              stroke="#342d23"
              stroke-width="2"/>
        <path d="M28 34 L47 10 L65 34Z"
              fill="#635542"
              stroke="#342d23"
              stroke-width="2"/>
    </g>

    <g id="tree">
