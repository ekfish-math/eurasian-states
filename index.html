<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>歐亞之國</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="game">


    <!-- =========================
         頂部
    ========================== -->

    <header class="topbar">

        <div class="logo">

            <div class="logo-main">
                歐亞之國
            </div>

            <div class="logo-version">
                EURASIAN STATES
            </div>

        </div>


        <div class="date">

            <span>
                世界紀元
            </span>

            <strong>
                帝元 845 年
            </strong>

            <span>
                第一季
            </span>

        </div>

    </header>


    <!-- =========================
         主體
    ========================== -->

    <main class="main">


        <!-- =====================
             左側
        ====================== -->

        <aside class="sidebar">

            <div class="section-title">
                世界
            </div>


            <nav class="menu">

                <button class="active">
                    🗺 世界地圖
                </button>

                <button>
                    👥 人口
                </button>

                <button>
                    🌾 生產
                </button>

                <button>
                    🏛 國家
                </button>

                <button>
                    🤝 外交
                </button>

                <button>
                    ⚔ 軍事
                </button>

                <button>
                    🔬 科技
                </button>

            </nav>


            <div class="divider"></div>


            <div class="section-title">
                遊戲狀態
            </div>

            <div class="empty">

                世界正在運行。

                <br><br>

                帝元 845 年

                <br>

                第一月

                <br><br>

                下一個世界日：

                <br>

                2 小時後

            </div>

        </aside>


        <!-- =====================
             地圖
        ====================== -->

        <section class="map-area">


            <div class="map-header">

                <div class="map-title">
                    世界地圖
                </div>

                <div class="map-subtitle">
                    EURASIAN WORLD · 845
                </div>

            </div>


            <div id="mapMount"></div>


            <div class="map-controls">

                <button id="zoomIn">
                    +
                </button>

                <button id="zoomOut">
                    −
                </button>

                <button id="resetMap">
                    ⟳
                </button>

            </div>

        </section>


        <!-- =====================
             右側資訊
        ====================== -->

        <aside class="info-panel">


            <div class="info-title">
                地區資料
            </div>


            <h1 id="provinceName">
                尚未選擇
            </h1>


            <div id="provinceTerrain">
                點擊地圖上的地區
            </div>


            <div class="divider"></div>


            <!-- 人口 -->

            <div class="stat">

                <div class="stat-head">

                    <span>
                        人口
                    </span>

                    <span
                        id="population"
                        class="stat-value"
                    >
                        —
                    </span>

                </div>

            </div>


            <!-- 農業 -->

            <div
                id="agriculture"
                class="stat"
            >

                <div class="stat-head">

                    <span>
                        農業
                    </span>

                    <span class="stat-value">
                        —
                    </span>

                </div>

                <div class="bar">

                    <div class="bar-fill"></div>

                </div>

            </div>


            <!-- 林業 -->

            <div
                id="forestry"
                class="stat"
            >

                <div class="stat-head">

                    <span>
                        林業
                    </span>

                    <span class="stat-value">
                        —
                    </span>

                </div>

                <div class="bar">

                    <div class="bar-fill"></div>

                </div>

            </div>


            <!-- 礦業 -->

            <div
                id="mining"
                class="stat"
            >

                <div class="stat-head">

                    <span>
                        礦業
                    </span>

                    <span class="stat-value">
                        —
                    </span>

                </div>

                <div class="bar">

                    <div class="bar-fill"></div>

                </div>

            </div>


            <!-- 漁業 -->

            <div
                id="fishing"
                class="stat"
            >

                <div class="stat-head">

                    <span>
                        漁業
                    </span>

                    <span class="stat-value">
                        —
                    </span>

                </div>

                <div class="bar">

                    <div class="bar-fill"></div>

                </div>

            </div>


            <div class="divider"></div>


            <!-- 城市 -->

            <div class="info-title">
                城市
            </div>


            <div id="cityList">

                <div class="empty">

                    選擇一個地區後，

                    <br>

                    這裡會顯示城市資料。

                </div>

            </div>

        </aside>


    </main>

</div>


<script src="js/map.js"></script>

</body>

</html>
